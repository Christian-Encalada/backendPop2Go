services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pop2go-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: pop2go
      DB_SSL: "false"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pop2go
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: pop2go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pop2go
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pop2go"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  postgres_data:
